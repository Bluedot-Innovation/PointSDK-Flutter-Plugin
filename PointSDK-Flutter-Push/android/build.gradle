group 'io.bluedot.bluedot_point_sdk_push'
version '1.0.0'

buildscript {
    ext.kotlin_version = '2.3.0'
    ext.sdk_version = '19.0.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// DEV ONLY — Android Point SDK 19.0.0 hasn't been publicly released to jitpack yet. Until
// it is, resolve an internal release-candidate build from Bluedot's private GitLab Maven
// package registry instead (see the dependencies below). Provide the registry token via
// `gitlabPrivateToken=<token>` in this project's `android/local.properties` (already
// git-ignored, so it is never committed) — or pass it as a Gradle project property
// (`-PgitlabPrivateToken=<token>`). Remove this block once 19.0.0 is published.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

rootProject.allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven {
            url "https://gitlab.com/api/v4/projects/14682665/packages/maven"
            credentials(HttpHeaderCredentials) {
                name "Private-Token"
                value localProperties.getProperty('gitlabPrivateToken') ?: project.findProperty('gitlabPrivateToken') ?: ''
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'io.bluedot.bluedot_point_sdk_push'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 29
        compileSdk 36
    }
}

// ---------------------------------------------------------------------------
// Firebase BOM version
//
// The consumer app is responsible for applying the google-services plugin and
// placing google-services.json in their own app module. This library only
// needs the firebase-messaging artifact on the compile classpath; it does NOT
// need (or want) the google-services Gradle plugin.
//
// Override the BOM version from your app's build.gradle / gradle.properties:
//   ext.firebaseBomVersion = '34.0.0'
// ---------------------------------------------------------------------------
def firebaseBomVersion = rootProject.hasProperty('firebaseBomVersion') ?
        rootProject.property('firebaseBomVersion') : (project.hasProperty('firebaseBomVersion') ?
        project.property('firebaseBomVersion') : '34.12.0')

dependencies {
    // Official public release — restore these two lines once Android Point SDK 19.0.0 is
    // published to jitpack, and remove the two "DEV ONLY" lines below:
    // implementation "com.gitlab.bluedotio.android:point_sdk_android:$sdk_version"
    // implementation "com.gitlab.bluedotio.android:point_sdk_push:$sdk_version"

    // DEV ONLY — internal release-candidate build of Point SDK 19.0.0 (core + push
    // notifications modules), resolved from Bluedot's private GitLab Maven package
    // registry (see repository config above). Must match the release-candidate build
    // number used by the base plugin (android/build.gradle).
    implementation 'au.com.bluedot:pointsdk:1380190974'
    implementation 'au.com.bluedot:pushnotifications:1380190974'

    implementation platform("com.google.firebase:firebase-bom:${firebaseBomVersion}")
    implementation "com.google.firebase:firebase-messaging"
}


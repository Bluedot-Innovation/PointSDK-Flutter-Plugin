group 'io.bluedot.bluedot_point_sdk'
version '3.0.0'

buildscript {
    ext.kotlin_version = '2.3.0'
    ext.sdk_version = '19.0.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}


// DEV ONLY — Android Point SDK 19.0.0 hasn't been publicly released to jitpack yet. Until
// it is, resolve an internal release-candidate build from Bluedot's private GitLab Maven
// package registry instead (see the dependency below). Provide the registry token via
// `gitlabPrivateToken=<token>` in this project's `android/local.properties` (already
// git-ignored, so it is never committed) — or pass it as a Gradle project property
// (`-PgitlabPrivateToken=<token>`). Remove this block once 19.0.0 is published.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

rootProject.allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven {
            url "https://gitlab.com/api/v4/projects/14682665/packages/maven"
            credentials(HttpHeaderCredentials) {
                name "Private-Token"
                value localProperties.getProperty('gitlabPrivateToken') ?: project.findProperty('gitlabPrivateToken') ?: ''
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {

    namespace 'io.bluedot.bluedot_point_sdk'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 29
        compileSdk 36
    }
}

dependencies {
    // Official public release — restore this once Android Point SDK 19.0.0 is published to jitpack:
    // implementation "com.gitlab.bluedotio.android:point_sdk_android:$sdk_version"

    // DEV ONLY — internal release-candidate build of Point SDK 19.0.0, resolved from
    // Bluedot's private GitLab Maven package registry (see repository config above).
    implementation 'au.com.bluedot:pointsdk:1380190974'
}

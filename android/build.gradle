group 'io.bluedot.bluedot_point_sdk'
version '2.1.2'

buildscript {
    ext.kotlin_version = '2.3.0'
    ext.sdk_version = '18.0.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Load local.properties from the consumer app's root project so that
// gitlabPipelineId / gitlabMavenToken defined there are visible here.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def gitlabPipelineId = localProperties.getProperty('gitlabPipelineId') ?:
        rootProject.findProperty('gitlabPipelineId') ?: project.findProperty('gitlabPipelineId') ?: ''
def gitlabMavenToken = localProperties.getProperty('gitlabMavenToken') ?:
        rootProject.findProperty('gitlabMavenToken') ?: project.findProperty('gitlabMavenToken') ?: ''

rootProject.allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        if (gitlabPipelineId) {
            maven {
                url 'https://gitlab.com/api/v4/projects/14682665/packages/maven'
                credentials(HttpHeaderCredentials) {
                    name  'Private-Token'
                    value gitlabMavenToken
                }
                authentication {
                    header(HttpHeaderAuthentication)
                }
            }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {

    namespace 'io.bluedot.bluedot_point_sdk'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 29
        compileSdk 36
    }
}

dependencies {
    if (gitlabPipelineId) {
        implementation "au.com.bluedot:pointsdk:${gitlabPipelineId}"
    } else {
        implementation "com.gitlab.bluedotio.android:point_sdk_android:$sdk_version"
    }
}
